name: 问题反馈 / Bug report
description: 通知没弹出、文案不对、安装失败等问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认 [README 的常见问题](https://github.com/WsttXm/DshNotice/blob/main/README.md#常见问题)
        里没有已经给出的答案，再填写下面的内容。

  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 你期望发生什么，实际发生了什么。
      placeholder: 我切到别的应用让 agent 提问，但没有出现横幅。
    validations:
      required: true

  - type: textarea
    id: diagnostic
    attributes:
      label: 诊断信息
      description: |
        在 Harness 窗口里按 ⌥⌘I 打开开发者工具，在控制台执行下面一行，把输出粘到这里。
        这段输出包含系统版本、插件版本、权限状态和最近的通知记录，能省掉好几个来回。
        ```js
        JSON.stringify({ ua: navigator.userAgent, href: location.href, state: window.__DSH_NOTICE__?.state() }, null, 2)
        ```
      render: json
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. node plugin.mjs install
        2. ⌘R 刷新窗口
        3. 切到其他应用
        4. 让 agent 执行一次需要授权的 bash 命令
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: 版本
      description: DeepSeek Harness 桌面版版本、macOS 版本、Node 版本。
      placeholder: DSH 0.2.0-rc.2 / macOS 15.2 (arm64) / Node 22.11.0
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 已确认
      options:
        - label: "「系统设置 → 通知 → DeepSeek Harness」里允许了通知，且样式不是「无」"
          required: true
        - label: 我已经把 Harness 窗口切到后台再触发，而不是盯着窗口测试
          required: true
